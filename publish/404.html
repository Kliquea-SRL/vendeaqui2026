<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Página no encontrada</title>

  <!-- Google Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght@400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 420px;
    }

    .material-symbols-rounded {
      font-size: 90px;
      color: #ef4444;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 5rem;
      line-height: 1;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 15px;
      font-weight: 600;
    }

    p {
      color: #cbd5e1;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 12px 24px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: .25s;
    }

    a:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="material-symbols-rounded">wifi_off</span>

    <h1>404</h1>
    <h2>Página no encontrada</h2>

    <p>
      Parece que esta página no existe o ya no está disponible.
      Verifica la dirección o regresa al inicio.
    </p>

    <a href="/">Volver al inicio</a>
  </div>

</body>
</html>
